[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "korean-eot-stream-pilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<2", "scipy>=1.11,<2", "soundfile>=0.12,<1", "datasets>=3.2,<5", "onnxruntime>=1.20,<2", "transformers>=4.48,<5", "huggingface-hub>=0.30,<1", "livekit-local-inference==0.2.7"]
[project.scripts]
eot-stream = "eot_stream.cli:main"
[tool.setuptools.packages.find]
include = ["eot_stream*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
